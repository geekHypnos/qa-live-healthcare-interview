spring.application.name=qa-service-user
server.address=127.0.0.1
server.port=${SERVER_PORT:18080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13306/qa_healthcare?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:qa_app}
spring.datasource.password=${DB_PASSWORD:qa_demo_database_2026}
spring.datasource.hikari.connection-timeout=5000
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
